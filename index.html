<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ─────────────────────────────────────────────── -->
  <title>Jinwon Lee</title>
  <meta name="description" content="Humanizing Technologies" />
  <meta name="keywords"
    content="Jinwon Lee, System Designer, Creative Technologists, Samsung, Galaxy, One UI, portfolio, interaction design" />
  <meta name="author" content="Jinwon Lee" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://leejinwon.com" />

  <!-- ── Favicon ─────────────────────────────────────────────────── -->
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="msapplication-TileColor" content="#ffffff" />

  <!-- ── Open Graph (Facebook · LinkedIn · KakaoTalk · Slack · iMessage) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jinwon Lee" />
  <meta property="og:title" content="Jinwon Lee" />
  <meta property="og:description" content="Humanizing Technologies" />
  <meta property="og:image" content="https://leejinwon.com/og-image.png" />
  <meta property="og:image:secure_url" content="https://leejinwon.com/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Jinwon Lee" />
  <meta property="og:url" content="https://leejinwon.com" />
  <meta property="og:locale" content="en_US" />

  <!-- ── Twitter / X Card ────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jinwon Lee" />
  <meta name="twitter:description" content="Humanizing Technologies" />
  <meta name="twitter:image" content="https://leejinwon.com/og-image.png" />
  <meta name="twitter:image:alt" content="Jinwon Lee" />

  <!-- ── JSON-LD Structured Data (Google Search) ─────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jinwon Lee",
    "url": "https://leejinwon.com",
    "image": "https://leejinwon.com/og-image.png",
    "jobTitle": "System Designer & Creative Technologists",
    "description": "System Designer and Creative Technologists specializing in Samsung Galaxy One UI, wearable UX, and interactive media.",
    "knowsAbout": ["System Design", "Interaction Design", "Samsung Galaxy", "One UI", "Creative Technology"]
  }
  </script>

  <!-- ── SPA Redirect Restore (GitHub Pages) ─────────────────────── -->
  <script>
    (function () {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>

  <!-- ── Fonts & Styles ──────────────────────────────────────────── -->
  <!-- typekit 스타일시트는 렌더 블로킹이라 이게 오기 전엔 아무것도 안 그려진다.
       연결(DNS+TLS)을 미리 열어두면 그 대기 시간이 줄어든다. -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>

  <!-- 3D 에셋 선행 로드.
       이 파일들을 받으라는 코드는 Experience 청크 안에 있어서, 번들을 내려받고
       파싱이 끝나야 비로소 요청이 나간다(실측: 청크 완료 96ms -> 모델 시작 124ms,
       느린 회선에서는 이 간격이 그대로 수 초가 된다).
       HTML에 적어두면 브라우저가 문서를 읽는 즉시 JS와 나란히 받기 시작한다. -->
  <link rel="preload" as="fetch" href="/models/XR.glb">
  <link rel="preload" as="fetch" href="/models/headphone.glb">
  <link rel="preload" as="fetch" href="/models/news.glb">
  <link rel="preload" as="fetch" href="/models/smartwatch.glb">
  <link rel="preload" as="fetch" href="/models/monitor.glb">
  <link rel="preload" as="fetch" href="/models/phone.glb">
  <link rel="preload" as="image" href="/3DUI/calendar.webp">
  <link rel="preload" as="image" href="/3DUI/clock.webp">
  <link rel="preload" as="image" href="/3DUI/reminder.webp">
  <link rel="stylesheet" href="https://use.typekit.net/oie1kpt.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "golos-text", sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e5e5e5;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #d4d4d4;
    }
  </style>
  <link rel="stylesheet" href="/index.css">

  <!-- ── Analytics ───────────────────────────────────────────────── -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="f95a8f15-37f2-4987-9aac-057eb3f1a58f"></script>

</head>

</body>

</html>
